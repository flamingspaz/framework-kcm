name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH_DEPS: >-
    base-devel git rust cmake extra-cmake-modules
    qt6-base qt6-declarative kcoreaddons ki18n kcmutils kirigami
    hidapi libusb systemd-libs polkit hicolor-icon-theme
  UBUNTU_DEPS: >-
    build-essential cmake git ca-certificates pkgconf gettext dpkg-dev file
    rustc cargo extra-cmake-modules qt6-base-dev qt6-declarative-dev
    libkf6kcmutils-dev libkf6i18n-dev libkf6coreaddons-dev libudev-dev

jobs:
  build:
    name: Build (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086 # split the package list on purpose
          pacman -Syu --noconfirm --needed $ARCH_DEPS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
          key: cargo-arch-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"

      - name: Test install
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: Check translations are up to date
        run: |
          # The checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          po/update.sh
          # POT-Creation-Date always changes; anything else means stale .po files
          if ! git diff --quiet -I '^"POT-Creation-Date:' -- po; then
            git --no-pager diff --stat -- po
            echo "::warning::po/ is out of date, run po/update.sh"
          fi

  gui-only:
    name: Build standalone GUI without KDE Frameworks
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake qt6-base-dev qt6-declarative-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build standalone GUI
        run: |
          cmake -B build-gui -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_KCM=OFF -DBUILD_GUI=ON -DBUILD_DAEMON=OFF
          cmake --build build-gui --target framework-settings -j"$(nproc)"
          if ldd build-gui/gui/framework-settings | grep -Eq 'libKF[56]'; then
            echo "::error::Standalone GUI unexpectedly links KDE Frameworks libraries"
            exit 1
          fi

  version:
    name: Check tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n 's/^project(framework-kcm VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -n1)
          if [ "$tag" != "$cmake_version" ] || [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag doesn't match CMakeLists.txt ($cmake_version) and daemon/Cargo.toml ($cargo_version)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  arch-package:
    name: Package for Arch Linux
    needs: [build, version]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086 # split the package list on purpose
          pacman -Syu --noconfirm --needed $ARCH_DEPS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pkg
          git archive --format=tar.gz --prefix="framework-settings-$VERSION/" -o "/tmp/pkg/framework-settings-$VERSION.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/frameworkd.install /tmp/pkg/
          sed -i \
            -e "s|^pkgver=.*|pkgver=$VERSION|" \
            -e "s|^url=.*|url='$GITHUB_SERVER_URL/$GITHUB_REPOSITORY'|" \
            /tmp/pkg/PKGBUILD

      - name: Build package
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --noconfirm'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package
          # Leave out the -debug split package
          path: |
            /tmp/pkg/framework-*.pkg.tar.zst
            /tmp/pkg/frameworkd-*.pkg.tar.zst
            !/tmp/pkg/*-debug-*.pkg.tar.zst
          if-no-files-found: error

  ubuntu-package:
    name: Package for Ubuntu 26.04
    needs: [build, version]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # shellcheck disable=SC2086 # split the package list on purpose
          apt-get install -y --no-install-recommends $UBUNTU_DEPS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON
          cmake --build build -j"$(nproc)"

      - name: Build package
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-package
          path: build/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: [arch-package, ubuntu-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
